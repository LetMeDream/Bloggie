# /project/frontend/nginx.conf

server {
    listen 80; # Nginx escucha en el puerto 80

    # Configuración para servir los archivos estáticos de React
    location / {
        root /usr/share/nginx/html; # Directorio donde Nginx encuentra tus archivos React
        try_files $uri $uri/ /index.html; # Para enrutamiento de React (SPA)
    }

    # Configuración de Proxy Inverso para la API de Django
    # Todas las solicitudes que empiecen con /api/ serán reenviadas al backend
    location /api/ {
        # IMPORTANTE: Esto es si el backend está en un *contenedor separado*
        # y ambos están en la misma red de Docker Compose.
        # Si el backend está en tu *máquina local*, esto debería ser:
        # proxy_pass http://host.docker.internal:8000;
        
        proxy_pass http://api_service:8000; # Nombre del servicio Django en Docker Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}